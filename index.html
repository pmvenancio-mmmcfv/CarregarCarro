<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#030712">
  <meta name="mobile-web-app-capable" content="yes">
  <title>EV Charge Optimizer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #030712; color: #f9fafb; font-family: system-ui, -apple-system, sans-serif; }
    input[type="range"] { accent-color: #059669; }
    .card-base { background: #111827; border: 1px solid #1f2937; }
    .card-best { background: linear-gradient(135deg, #064e3b 0%, #022c22 100%); border: 2px solid #10b981; }
  </style>
</head>
<body class="pb-16 select-none">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#030712]/95 backdrop-blur border-b border-gray-800 px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="text-emerald-400 text-lg font-bold">⚡</span>
      <h1 class="text-xs font-bold uppercase tracking-wider text-gray-200">EV Charge Optimizer</h1>
    </div>
    <span id="tariffPeriod" class="text-[10px] bg-gray-800 text-emerald-400 px-2 py-0.5 rounded-full font-mono font-bold">--</span>
  </header>

  <main class="max-w-md mx-auto px-4 pt-4 space-y-3.5">

    <!-- 1. Posto / OPC -->
    <section class="card-base rounded-2xl p-3.5 space-y-2.5 shadow-lg">
      <div class="flex justify-between items-center">
        <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400">1. Tarifas do Posto (OPC)</span>
        <button onclick="presetAtlanteAC()" class="text-[10px] text-emerald-400 font-medium">Reset Atlante AC</button>
      </div>

      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-[9px] text-gray-400 mb-1">OPC (€/kWh)</label>
          <input id="opcKwh" type="number" step="0.001" value="0.146" oninput="calculate()" class="w-full bg-gray-900 border border-gray-700 rounded-lg py-1.5 px-2 text-xs text-white font-bold text-center">
        </div>
        <div>
          <label class="block text-[9px] text-gray-400 mb-1">OPC (€/min)</label>
          <input id="opcMin" type="number" step="0.001" value="0.000" oninput="calculate()" class="w-full bg-gray-900 border border-gray-700 rounded-lg py-1.5 px-2 text-xs text-white font-bold text-center">
        </div>
        <div>
          <label class="block text-[9px] text-gray-400 mb-1">App Direta (c/IVA)</label>
          <input id="directVat" type="number" step="0.01" value="0.39" oninput="calculate()" class="w-full bg-gray-900 border border-emerald-500/40 rounded-lg py-1.5 px-2 text-xs text-emerald-300 font-bold text-center">
        </div>
      </div>
    </section>

    <!-- 2. Bateria -->
    <section class="card-base rounded-2xl p-3.5 space-y-2.5 shadow-lg">
      <div class="flex justify-between items-center">
        <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400">2. Carga (Caddy eHybrid - 19.7 kWh)</span>
        <span id="kwhBadge" class="text-xs text-emerald-400 font-mono font-bold">17.5 kWh</span>
      </div>

      <div class="grid grid-cols-2 gap-3 bg-gray-900/60 p-2.5 rounded-xl border border-gray-800">
        <div>
          <div class="flex justify-between text-[11px] mb-1">
            <span class="text-gray-400">Início</span>
            <span id="socStartVal" class="font-bold text-white">15%</span>
          </div>
          <input id="socStart" type="range" min="0" max="90" step="5" value="15" class="w-full" oninput="updateBattery()">
        </div>
        <div>
          <div class="flex justify-between text-[11px] mb-1">
            <span class="text-gray-400">Alvo</span>
            <span id="socEndVal" class="font-bold text-emerald-400">100%</span>
          </div>
          <input id="socEnd" type="range" min="10" max="100" step="5" value="100" class="w-full" oninput="updateBattery()">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[9px] text-gray-400 mb-1">Potência de Carga</label>
          <select id="powerKw" onchange="updateBattery()" class="w-full bg-gray-900 border border-gray-700 rounded-lg py-1.5 px-2 text-xs text-white font-bold">
            <option value="11" selected>11 kW AC (Trifásico)</option>
            <option value="7.4">7.4 kW AC (Monofásico)</option>
            <option value="3.7">3.7 kW AC (Lento)</option>
            <option value="38">40 kW DC (Rápido)</option>
          </select>
        </div>
        <div>
          <label class="block text-[9px] text-gray-400 mb-1">Tempo Estimado</label>
          <div id="timeVal" class="bg-gray-900 border border-gray-700 rounded-lg py-1.5 px-2 text-xs text-emerald-400 font-bold font-mono text-center">96 min</div>
        </div>
      </div>
    </section>

    <!-- 3. Resultados -->
    <section class="space-y-2">
      <div class="flex justify-between items-center px-1">
        <span class="text-[10px] font-bold uppercase tracking-wider text-gray-400">3. Ranking (CEME + Roaming c/ IVA)</span>
      </div>
      <div id="resultsContainer" class="space-y-2"></div>
    </section>

  </main>

  <script>
    const CAPACITY = 19.7;
    const LOSS = 1.05;
    const IVA = 1.23;
    const IEC = 0.001;

    // Base completa e inteligente com CEME Nacionais, Novos Operadores e Roaming
    const providers = [
      { type: 'ceme', name: "EVIO CEME", fv: 0.169, vz: 0.169, act: 0.15 },
      { type: 'ceme', name: "Iberlectra (Indexado OMIE)", fv: 0.195, vz: 0.125, act: 0.11 },
      { type: 'ceme', name: "Luzigás (Indexado OMIE)", fv: 0.198, vz: 0.128, act: 0.00 },
      { type: 'ceme', name: "Goldenergy / ACP Electric", fv: 0.215, vz: 0.145, act: 0.00 },
      { type: 'ceme', name: "EDP Comercial Mobilidade", fv: 0.228, vz: 0.158, act: 0.00 },
      { type: 'ceme', name: "Galp Electric", fv: 0.242, vz: 0.169, act: 0.00 },
      { type: 'ceme', name: "ViaVerde Electric", fv: 0.224, vz: 0.162, act: 0.07 },
      // Roaming e Apps Internacionais / Soluções Diretas
      { type: 'flat', name: "Octopus Electroverse", rate: 0.38, info: "Roaming direto via app" },
      { type: 'flat', name: "Elli (Grupo VW)", rate: 0.42, info: "Tarifa europeia standard" },
      { type: 'flat', name: "Moeve Gow (ex-Cepsa)", rate: 0.40, info: "Rede Moeve mobilidade" }
    ];

    function presetAtlanteAC() {
      document.getElementById('opcKwh').value = 0.146;
      document.getElementById('opcMin').value = 0.000;
      document.getElementById('directVat').value = 0.39;
      calculate();
    }

    function updateBattery() {
      let start = parseInt(document.getElementById('socStart').value);
      let end = parseInt(document.getElementById('socEnd').value);
      if (end <= start) { end = Math.min(100, start + 5); document.getElementById('socEnd').value = end; }

      document.getElementById('socStartVal').innerText = start + '%';
      document.getElementById('socEndVal').innerText = end + '%';

      const delta = (end - start) / 100.0;
      const kwh = +(CAPACITY * delta * LOSS).toFixed(1);
      document.getElementById('kwhBadge').innerText = kwh + ' kWh';

      const power = parseFloat(document.getElementById('powerKw').value);
      const mins = Math.round((kwh / power) * 60);
      document.getElementById('timeVal').innerText = mins + ' min';

      calculate();
    }

    function calculate() {
      const start = parseInt(document.getElementById('socStart').value);
      const end = parseInt(document.getElementById('socEnd').value);
      const delta = (end - start) / 100.0;
      const kwh = +(CAPACITY * delta * LOSS).toFixed(1);
      const power = parseFloat(document.getElementById('powerKw').value);
      const mins = Math.round((kwh / power) * 60);

      const opcKwh = parseFloat(document.getElementById('opcKwh').value) || 0;
      const opcMin = parseFloat(document.getElementById('opcMin').value) || 0;
      const directVat = parseFloat(document.getElementById('directVat').value) || 0;

      const opcTotalVat = ((kwh * opcKwh) + (mins * opcMin)) * IVA;
      
      const hour = new Date().getHours();
      const isVazio = (hour >= 22 || hour < 8);
      document.getElementById('tariffPeriod').innerText = isVazio ? '🌙 Vazio' : '☀️ Fora Vazio';

      let results = [];

      providers.forEach(p => {
        if (p.type === 'ceme') {
          const rate = isVazio ? p.vz : p.fv;
          const cemeVat = ((kwh * (rate + IEC)) + (p.act || 0)) * IVA;
          const total = cemeVat + opcTotalVat;
          results.push({
            name: p.name,
            total: total,
            unit: total / kwh,
            desc: `CEME: ${cemeVat.toFixed(2)}€ | OPC: ${opcTotalVat.toFixed(2)}€`
          });
        } else if (p.type === 'flat') {
          const total = kwh * p.rate;
          results.push({
            name: p.name,
            total: total,
            unit: p.rate,
            desc: p.info
          });
        }
      });

      // App direta do posto
      const directTotal = kwh * directVat;
      results.push({
        name: "📱 App Direta do Posto (Ad-Hoc)",
        total: directTotal,
        unit: directVat,
        desc: `Tarifa direta balcão c/ IVA`
      });

      results.sort((a, b) => a.total - b.total);
      const best = results[0].total;

      const container = document.getElementById('resultsContainer');
      container.innerHTML = results.map((r, i) => {
        const diff = r.total - best;
        const cost100 = r.unit * 16.5;
        if (i === 0) {
          return `
            <div class="card-best rounded-2xl p-3.5 shadow-xl">
              <div class="flex justify-between items-start">
                <div>
                  <span class="bg-emerald-500 text-slate-950 font-black text-[9px] px-1.5 py-0.5 rounded uppercase">Recomendado</span>
                  <div class="font-bold text-sm text-white mt-1">${r.name}</div>
                  <div class="text-[10px] text-emerald-100/80 mt-0.5">${r.desc}</div>
                </div>
                <div class="text-right">
                  <div class="text-xl font-black text-emerald-300 leading-none">${r.total.toFixed(2)} €</div>
                  <div class="text-[10px] text-emerald-200 font-mono mt-1">${r.unit.toFixed(3)} €/kWh</div>
                </div>
              </div>
              <div class="mt-2.5 pt-2 border-t border-emerald-500/30 flex justify-between items-center text-[11px] text-emerald-100 font-medium">
                <span>Custo 100 km: <b>${cost100.toFixed(2)} €</b></span>
                <span><b>Mais barato</b></span>
              </div>
            </div>
          `;
        } else {
          return `
            <div class="card-base rounded-xl p-3 shadow-md">
              <div class="flex justify-between items-center">
                <div>
                  <div class="flex items-center gap-1.5">
                    <span class="text-[10px] font-bold text-gray-500">#${i+1}</span>
                    <span class="font-semibold text-xs text-gray-200">${r.name}</span>
                  </div>
                  <div class="text-[9px] text-gray-400 mt-0.5">${r.desc}</div>
                </div>
                <div class="text-right">
                  <div class="text-sm font-bold text-gray-100 leading-none">${r.total.toFixed(2)} €</div>
                  <div class="text-[9px] text-rose-400 font-mono mt-1">+${diff.toFixed(2)} €</div>
                </div>
              </div>
            </div>
          `;
        }
      }).join('');
    }

    updateBattery();
  </script>
</body>
</html>
